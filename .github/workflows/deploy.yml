name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_NEWS_API_KEY: ${{ secrets.VITE_NEWS_API_KEY }}
          VITE_NEWS_PROXY_URL: ${{ secrets.VITE_NEWS_PROXY_URL }}
        run: |
          if [ -z "$VITE_NEWS_PROXY_URL" ]; then
            echo "::error::Repository secret VITE_NEWS_PROXY_URL is missing or empty."
            echo "Without it, the Pages build talks to gnews.io from the browser and hits CORS (Failed to fetch)."
            echo "Add it under Settings → Secrets and variables → Actions (same repo as this workflow)."
            exit 1
          fi
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4